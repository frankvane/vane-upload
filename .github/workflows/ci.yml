name: CI

on:
  push:
    # D-03 决策：主干保留 master（仓库默认分支即 master），不迁移 main。
    # 原配置监听 main，而主干从未向 main 推送，导致门禁在主干上从未真正执行。
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 必须 ≥22.8：后端覆盖率门禁用 `--test-coverage-lines/branches/functions`
      # （v22.8.0 引入）与 `--test-coverage-include/exclude`（v22.5.0 引入）。
      # 钉在 20 时 Node 把它们当未知启动参数，**以退出码 9 静默退出且不打印任何错误**
      # —— run #1 的失败就是这个，日志里只有一句 "Process completed with exit code 9"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # 与本地 `npm run ci` 完全同一条命令，避免 CI 与本地门禁漂移。
      # 单条命令的代价是「失败时只报这一整步失败」，看不出断在哪个阶段，
      # 下面的 Locate failing stage 专门补这个可观测性缺口。
      - name: Full gate (typecheck / lint / tests / build)
        run: npm run ci
      # 仅在上面失败时执行：逐阶段重跑，把「哪个阶段 + 报错日志尾部」直接打进
      # job 摘要。正常路径不额外耗时；阶段列表与 package.json 的 ci 脚本同序，
      # 增删阶段时两处要一起改（`ci` 仍是唯一权威，这里只做定位）。
      - name: Locate failing stage
        if: failure()
        run: |
          set -o pipefail
          for s in check-node typecheck lint test:coverage check-coverage-floor test:server:coverage build size:check check:dev-only; do
            if npm run "$s" >"/tmp/$s.log" 2>&1; then
              echo "PASS  $s"
            else
              echo "::error title=门禁失败::npm run $s"
              echo "===== $s（日志尾部） ====="
              tail -n 80 "/tmp/$s.log"
              exit 1
            fi
          done
      - name: Container image smoke
        run: |
          # 失败时把关键几行打进 annotation：Actions 日志需要权限才能读，
          # 而 annotation 是公开可见的，否则这一步失败只剩一句 "exit code 1"。
          #
          # 必须显式开 pipefail：`run` 的默认 shell 是 `bash -e {0}`，
          # 不带 pipefail，`docker build | tee` 的退出码会变成 tee 的 0，
          # 失败会被吞掉、这一步永远绿。
          set -o pipefail
          if docker build -t vane-upload-server:ci . 2>&1 | tee /tmp/docker-build.log; then
            exit 0
          fi
          FIRST=$(grep -m1 -iE 'ERR!|error|failed|not found' /tmp/docker-build.log | cut -c1-300)
          TAIL=$(tail -n 3 /tmp/docker-build.log | tr '\n' ' ' | cut -c1-300)
          echo "::error title=镜像构建失败::首个错误行为「${FIRST}」；尾部「${TAIL}」"
          exit 1
      # T-44：镜像构建成功后**真 run** 容器并轮询健康状态，非 healthy 打印日志并失败。
      # 删除 /api/health 路由（或让 USER node 写不了三个 VOLUME）会让这一步变红，
      # 从而把「镜像能起、但服务不健康」这类假绿挡在门禁外。
      - name: Container image run + health wait
        run: |
          set -o pipefail
          docker run -d --name vane-ci -p 3000:3000 \
            -e AUTH_MODE=secure \
            -e PORT=3000 \
            vane-upload-server:ci
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' vane-ci 2>/dev/null || echo "no-health")
            echo "wait $i: health=$status"
            if [ "$status" = "healthy" ]; then
              echo "container healthy"
              docker logs vane-ci 2>&1 | tail -n 20
              docker rm -f vane-ci >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done
          echo "::error title=容器未进入 healthy::60s 内未健康，打印日志"
          docker logs vane-ci 2>&1 | tail -n 40
          docker rm -f vane-ci >/dev/null 2>&1 || true
          exit 1

  # T-43：浏览器级 E2E 作为独立 job 与 verify 并行跑，避免拖慢快门禁；
  # 也隔离 E2E 的偶发抖动（VU-63-6 冷启动），不与单元测试门禁互相牵连。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # T-43：安装 chromium 及其系统依赖（GitHub runner 默认 root，--with-deps 可用）。
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (browser-level regression)
        run: npm run test:e2e
