name: CI

on:
  push:
    # D-03 决策：主干保留 master（仓库默认分支即 master），不迁移 main。
    # 原配置监听 main，而主干从未向 main 推送，导致门禁在主干上从未真正执行。
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      # 与本地 `npm run ci` 完全同一条命令，避免 CI 与本地门禁漂移。
      - name: Full gate (typecheck / lint / tests / build)
        run: npm run ci
      - name: Container image smoke
        run: docker build -t vane-upload-server:ci .
