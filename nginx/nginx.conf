# vane-upload 反向代理基线（限流 + 真实客户端 IP 透传）
#
# 用途：在 Node 服务前放置一层 Nginx，承担 TLS 终止、静态托管与请求级限流。
#       真实客户端 IP 通过 X-Forwarded-For 透传给 Node，使 Node 侧 express-rate-limit
#       能按真实源 IP 分桶（需配合 Node 的 TRUST_PROXY_HOPS=1，否则退化为「全站单桶」）。
#
# 部署要点：
#   1) 限流桶按客户端 IP（$binary_remote_addr）限速，burst 允许短时突发；
#   2) 若本机 Nginx 之前还有 CDN / 云厂商等外层代理，必须打开 set_real_ip_from /
#      real_ip_header 还原真实客户端 IP，否则 $binary_remote_addr 取到的是外层代理 IP，
#      限流桶同样退化为单桶；
#   3) 应用层另有限流（express-rate-limit，RATE_LIMIT_MAX），两层互补：Nginx 挡边缘洪峰，
#      Node 层按真实源 IP 做细粒度配额。

# 1) 限流共享内存区：10MB 约可存 16 万 IP 的状态；rate 为单客户端限速。
limit_req_zone $binary_remote_addr zone=vane_upload_rl:10m rate=5r/s;

upstream vane_upload_app {
    # 与 .env 的 PORT 一致（默认 3000）
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 前端静态资源（SPA）：部署时将构建产物 dist/demo 置于该 root 下（见 docs/部署检查表）。
    # 本仓库 Dockerfile 当前仅打包后端，前端需另行提供 / 挂载到该目录；此处声明后，
    # nginx 才能真正承担文件头注释里宣称的「静态托管」职责（分析 P1：原配置自相矛盾）。
    root /usr/share/nginx/html;

    # 若 Nginx 之前还有外层代理（CDN / 云厂商回源），取消注释并按实际网段声明，
    # 否则真实客户端 IP 无法还原，限流桶会退化为「全站单桶」。
    # set_real_ip_from 10.0.0.0/8;      # 示例：内层私有网段 / CDN 回源段
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # 上传 / 业务接口：单独更严格的限流（大文件分片多、易被打满）。
    location /api/ {
        # burst=20 允许短时突发 20 个请求，nodelay 立即处理不排队。
        limit_req zone=vane_upload_rl burst=20 nodelay;

        proxy_pass http://vane_upload_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # 透传真实客户端 IP：Node 设 TRUST_PROXY_HOPS=1 后即按此头最右一跳取源 IP 分桶。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件分片上传允许更长的读取 / 发送超时（应用层另有 CHUNK_MAX_SIZE_MB 控体）。
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查：放开限流，避免被自身探活打满。
    location /api/health {
        proxy_pass http://vane_upload_app;
        proxy_set_header Host $host;
    }

    # SPA fallback：非文件资源统一回退到 index.html（刷新深链 / 路由不 404）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 contenthash 的静态资源长缓存（与上面的 SPA fallback 不冲突：
    # index.html 不在该扩展名列表内，仍走 location / 的动态回退）。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
