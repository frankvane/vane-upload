name: CI

on:
  push:
    # D-03 决策：主干保留 master（仓库默认分支即 master），不迁移 main。
    # 原配置监听 main，而主干从未向 main 推送，导致门禁在主干上从未真正执行。
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 必须 ≥22.8：后端覆盖率门禁用 `--test-coverage-lines/branches/functions`
      # （v22.8.0 引入）与 `--test-coverage-include/exclude`（v22.5.0 引入）。
      # 钉在 20 时 Node 把它们当未知启动参数，**以退出码 9 静默退出且不打印任何错误**
      # —— run #1 的失败就是这个，日志里只有一句 "Process completed with exit code 9"。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # 与本地 `npm run ci` 完全同一条命令，避免 CI 与本地门禁漂移。
      # 单条命令的代价是「失败时只报这一整步失败」，看不出断在哪个阶段，
      # 下面的 Locate failing stage 专门补这个可观测性缺口。
      - name: Full gate (typecheck / lint / tests / build)
        run: npm run ci
      # 仅在上面失败时执行：逐阶段重跑，把「哪个阶段 + 报错日志尾部」直接打进
      # job 摘要。正常路径不额外耗时；阶段列表与 package.json 的 ci 脚本同序，
      # 增删阶段时两处要一起改（`ci` 仍是唯一权威，这里只做定位）。
      - name: Locate failing stage
        if: failure()
        run: |
          for s in typecheck lint test:coverage test:server:coverage build size:check; do
            if npm run "$s" >"/tmp/$s.log" 2>&1; then
              echo "PASS  $s"
            else
              echo "::error title=门禁失败::npm run $s"
              echo "===== $s（日志尾部） ====="
              tail -n 80 "/tmp/$s.log"
              exit 1
            fi
          done
      - name: Container image smoke
        run: |
          # 失败时把关键几行打进 annotation：Actions 日志需要权限才能读，
          # 而 annotation 是公开可见的，否则这一步失败只剩一句 "exit code 1"。
          #
          # 必须显式开 pipefail：`run` 的默认 shell 是 `bash -e {0}`，
          # 不带 pipefail，`docker build | tee` 的退出码会变成 tee 的 0，
          # 失败会被吞掉、这一步永远绿。
          set -o pipefail
          if docker build -t vane-upload-server:ci . 2>&1 | tee /tmp/docker-build.log; then
            exit 0
          fi
          FIRST=$(grep -m1 -iE 'ERR!|error|failed|not found' /tmp/docker-build.log | cut -c1-300)
          TAIL=$(tail -n 3 /tmp/docker-build.log | tr '\n' ' ' | cut -c1-300)
          echo "::error title=镜像构建失败::首个错误行为「${FIRST}」；尾部「${TAIL}」"
          exit 1
